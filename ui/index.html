<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Studio — Дашборд</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎨 Comic Studio</h1>
    <nav>
      <button data-tab="create">✨ Создать</button>
      <button data-tab="draft" class="active">Черновики</button>
      <button data-tab="approved">Утверждённые</button>
      <button data-tab="rendered">Готовые</button>
      <button data-tab="comics">Комиксы</button>
    </nav>
  </header>

  <main>
    <section id="tab-create" class="tab-content">
      <h2>✨ Создать комикс</h2>
      <form id="create-form">
        <div class="form-group">
          <label for="content">Контент:</label>
          <textarea id="content" placeholder="URL статьи, YouTube или текст..." required></textarea>
        </div>
        <div class="form-group">
          <label for="image-style">Стиль изображений:</label>
          <select id="image-style">
            <option value="cartoon">🎬 Cartoon</option>
            <option value="anime">🎌 Anime</option>
            <option value="comic" selected>📚 Comic (default)</option>
            <option value="realistic">📷 Realistic</option>
            <option value="watercolor">🎨 Watercolor</option>
          </select>
        </div>
        <button type="submit">✨ Создать сценарий</button>
      </form>
      <div id="create-result"></div>
    </section>

    <section id="tab-draft" class="tab-content active">
      <h2>📋 Черновики на утверждении</h2>
      <div id="draft-list" class="grid"></div>
    </section>

    <section id="tab-approved" class="tab-content">
      <h2>✅ Утверждённые (ждут рендера)</h2>
      <div id="approved-list" class="grid"></div>
    </section>

    <section id="tab-rendered" class="tab-content">
      <h2>🎬 Готовые (рендер завершён)</h2>
      <div id="rendered-list" class="grid"></div>
    </section>

    <section id="tab-comics" class="tab-content">
      <h2>🖼️ Все выпуски</h2>
      <div id="comics-list" class="grid"></div>
    </section>
  </main>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h3>✏️ Редактирование сценария</h3>
      <p>ID: <code id="edit-id"></code></p>
      <textarea id="edit-text" placeholder="Опишите правки..."></textarea>
      <div class="examples">
        <small>Примеры правок:</small>
        <div id="examples-list">
          <button class="example-btn">Убрать панель 2</button>
          <button class="example-btn">Сделать более смешным</button>
          <button class="example-btn">Добавить драмы в 3 панель</button>
          <button class="example-btn">Изменить концовку</button>
          <button class="example-btn">Добавить персонажа</button>
        </div>
      </div>
      <div class="modal-actions">
        <button id="edit-cancel">Отмена</button>
        <button id="edit-save">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="approve.js"></script>
  <script src="app.js"></script>
</body>
</html>
